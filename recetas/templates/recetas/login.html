{% extends "recetas/base.html" %}
{% block title %}RecetApp · Entrar{% endblock %}

{% block content %}
<div id="page-login" class="page active">
  <div class="login-card">
    <div class="login-logo">Recet<span>App</span></div>
    <div class="login-sub">Tu recetario digital personal</div>
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_username">Usuario</label>
        <input id="id_username" name="username" type="text" placeholder="admin" value="{{ form.username.value|default:'' }}" autofocus required>
      </div>
      <div class="form-group">
        <label for="id_password">Contraseña</label>
        <input id="id_password" name="password" type="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-sage login-btn">Entrar</button>
      {% if form.errors %}
      <div class="login-err">Usuario o contraseña incorrectos</div>
      {% endif %}
      <input type="hidden" name="next" value="{{ next }}">
    </form>
    <div style="margin-top:18px;font-size:0.76rem;color:var(--muted)">Usuario: <b>admin</b> · Contraseña: <b>1234</b></div>
  </div>
</div>
{% endblock %}
